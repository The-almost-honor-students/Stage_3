version: "3.8"

services:
  # Hazelcast Server
  hazelcast:
    image: hazelcast/hazelcast:5.4.0
    container_name: hazelcast
    environment:
      - HZ_CLUSTERNAME=books-cluster
    ports:
      - "5701:5701"
    volumes:
      - ./hazelcast-config/hazelcast.yaml:/opt/hazelcast/config_ext/hazelcast.yaml:ro
    command: ["hz", "start", "-c", "/opt/hazelcast/config_ext/hazelcast.yaml"]
    networks:
      - hazelcast-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5701/hazelcast/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Hazelcast Management Center (opcional, para monitoreo)
  hazelcast-mc:
    image: hazelcast/management-center:5.4.0
    container_name: hazelcast-mc
    environment:
      - MC_DEFAULT_CLUSTER=books-cluster
      - MC_DEFAULT_CLUSTER_MEMBERS=hazelcast:5701
    ports:
      - "8081:8080"
    depends_on:
      hazelcast:
        condition: service_healthy
    networks:
      - hazelcast-net

  ingestion:
    build:
      context: ./crawler
      dockerfile: Dockerfile
    container_name: ingestion
    environment:
      - PORT=7070
    ports:
      - "7070:7070"
    networks:
      - hazelcast-net
      - engine-net
    volumes:
      - engine-volume:/app

  indexing:
    build:
      context: ./indexer
      dockerfile: Dockerfile
    container_name: indexing
    environment:
      - HAZELCAST_HOST=hazelcast
      - HAZELCAST_PORT=5701
      - PORT=8080
    ports:
      - "8080:8080"
    depends_on:
      hazelcast:
        condition: service_healthy
    networks:
      - hazelcast-net
      - engine-net
    volumes:
      - engine-volume:/app

  search:
    build:
      context: ./search
      dockerfile: Dockerfile
    container_name: search
    environment:
      - HAZELCAST_HOST=hazelcast
      - HAZELCAST_PORT=5701
      - PORT=9090
    ports:
      - "9090:9090"
    depends_on:
      hazelcast:
        condition: service_healthy
    networks:
      - hazelcast-net
      - engine-net
    volumes:
      - engine-volume:/app/data

  # Nginx - Reverse Proxy / Load Balancer
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - search
      - indexing
      - ingestion
    networks:
      - hazelcast-net
      - engine-net

networks:
  hazelcast-net:
    driver: bridge
  engine-net:
    driver: bridge

volumes:
  engine-volume:
