upstream search_backend {
    least_conn;

    server 10.26.14.223:9090 max_fails=3 fail_timeout=30s;
    server 10.26.14.222:9090 max_fails=3 fail_timeout=30s;
    server 10.26.14.221:9090 max_fails=3 fail_timeout=30s;
}

server {
    listen 8000;
    server_name _;

    location /search/ {
        proxy_pass http://search_backend/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}
