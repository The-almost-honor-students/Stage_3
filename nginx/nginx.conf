upstream search_backend {
    least_conn;
    server search1:9090 max_fails=3 fail_timeout=30s;
    server search2:9090 max_fails=3 fail_timeout=30s;
    server search3:9090 max_fails=3 fail_timeout=30s;
}

server {
    listen 8000;
    server_name _;

    location /search/ {
        proxy_pass http://search_backend/;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}