upstream search_backend {
    least_conn;
    server host.docker.internal:9090 max_fails=3 fail_timeout=30s;
    server host.docker.internal:9091 max_fails=3 fail_timeout=30s;
    server host.docker.internal:9092 max_fails=3 fail_timeout=30s;

    # --- MODO LABORATORIO ---
    # server 10.0.0.11:9090 max_fails=3 fail_timeout=30s;
    # server 10.0.0.11:9091 max_fails=3 fail_timeout=30s;
    # server 10.0.0.11:9092 max_fails=3 fail_timeout=30s;
}

upstream indexing_backend {
    least_conn;
    server host.docker.internal:8080 max_fails=3 fail_timeout=30s;
    server host.docker.internal:8081 max_fails=3 fail_timeout=30s;
    server host.docker.internal:8082 max_fails=3 fail_timeout=30s;

    # --- MODO LABORATORIO ---
    # server 10.0.0.12:8080 max_fails=3 fail_timeout=30s;
    # server 10.0.0.12:8081 max_fails=3 fail_timeout=30s;
    # server 10.0.0.12:8082 max_fails=3 fail_timeout=30s;
}

upstream ingestion_backend {
    least_conn;
    server host.docker.internal:7070 max_fails=3 fail_timeout=30s;
    server host.docker.internal:7071 max_fails=3 fail_timeout=30s;
    server host.docker.internal:7072 max_fails=3 fail_timeout=30s;

    # --- MODO LABORATORIO ---
    # server 10.0.0.13:7070 max_fails=3 fail_timeout=30s;
    # server 10.0.0.13:7071 max_fails=3 fail_timeout=30s;
    # server 10.0.0.13:7072 max_fails=3 fail_timeout=30s;
}

server {
    listen 8000;
    server_name _;

    location /search/ {
        proxy_pass http://search_backend/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /indexing/ {
        proxy_pass http://indexing_backend/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /ingestion/ {
        proxy_pass http://ingestion_backend/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}
